# Builds the NEON firmware on GitHub's Linux machines, where JieLi's toolchain runs natively, then runs the whole
# test suite against the build.
#   a push to main: the build is kept with the run (Actions > the run > Artifacts), no release
#   a tag vX.Y (git tag v0.1 && git push origin v0.1): a release build (version vX.Y), published as the GitHub
#   release vX.Y with neon.fwsc and SHA256SUMS, once the tests pass. The FM-1 Firmware Hub lists the newest release.
name: Build NEON firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # to publish the release

concurrency:
  group: build-neon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (the UI font and icons are rasterised at build time)
        run: pip install Pillow fonttools

      - name: Cache the JieLi toolchain and SDK files
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-linux-toolchain-ac79-sdk-v1.2.1-2023-12-13

      - name: JieLi toolchain (clang 4.0.1 for pi32v2)
        run: |
          if [ ! -x "$HOME/.jieli/toolchain/pi32v2/bin/clang" ]; then
            sh tools/get_toolchain.sh
          fi
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" --version | head -1

      - name: JieLi AC79 SDK (the package uses three of its files)
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK"
          TAG=AC79NN_SDK_V1.2.1_2023-12-13
          URL=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git
          if [ ! -f "$SDK/cpu/wl82/tools/uboot.boot" ]; then
            rm -rf "$SDK"
            # only cpu/wl82/tools is needed; fall back to a whole shallow clone if the server refuses a partial one
            if git clone --depth 1 --filter=blob:none --sparse --branch "$TAG" "$URL" "$SDK"; then
              git -C "$SDK" sparse-checkout set cpu/wl82/tools
            fi
            if [ ! -f "$SDK/cpu/wl82/tools/uboot.boot" ]; then
              rm -rf "$SDK"
              git clone --depth 1 --branch "$TAG" "$URL" "$SDK"
            fi
          fi
          ls -l "$SDK/cpu/wl82/tools/uboot.boot"

      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi

      - name: Name the package
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = tag ]; then cp "build/felucca-${GITHUB_REF_NAME#v}.fwsc" dist/neon.fwsc; cp build/felucca-${GITHUB_REF_NAME#v}.fwsc build/felucca.fwsc
          else cp build/felucca.fwsc dist/neon.fwsc; fi
          cp build/felucca.bin dist/neon-app.bin
          (cd dist && sha256sum neon.fwsc neon-app.bin > SHA256SUMS)
          ls -l dist

      - name: Keep the build with this run
        uses: actions/upload-artifact@v4
        with:
          name: neon-firmware-${{ github.sha }}
          path: dist/

      - name: Keep the disassembly (tests/target_budget.py reads it; for looking into a cost change)
        uses: actions/upload-artifact@v4
        with:
          name: neon-disassembly-${{ github.sha }}
          path: build/felucca.dis
          if-no-files-found: ignore

      - name: Felucca's test suite
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
        run: sh tests/run_tests.sh

      - name: Publish the release (a version tag, the tests passed)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/neon.fwsc dist/neon-app.bin dist/SHA256SUMS --verify-tag \
            --title "NEON $GITHUB_REF_NAME" \
            --notes "NEON $GITHUB_REF_NAME, a synthwave groovebox firmware for the M-VAVE FM-1 (identity FM-1_1984).

          **Install:** with the FM-1 Firmware Hub (https://thefirmwarehub.com) or any FM-1 installer that takes a \`.fwsc\` file. Back up your projects first. M-VAVE's own updater takes the FM-1 back to the official firmware.

          **Try it without an FM-1:** open https://joakimeriksson.github.io/fm1-emu, load \`neon.fwsc\`, press Start.

          See the README for what's in it."
